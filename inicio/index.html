<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Inicio</title>
<script>
/* =============================================================
   ENTRADA COMÚN
   Abre la última versión vista en este navegador. Si no hay ninguna,
   muestra la lista para elegir. Con ?elegir en la dirección, muestra
   siempre la lista.
   Para añadir una versión: una línea más en VERSIONES (mismos datos
   que "versiones" en el config.js de cada versión).
   ============================================================= */
var VERSIONES = [
  { id: "usa-es", bandera: "ES", nombre: "España", url: "../inicio-usa-espana/index.html" },
  { id: "usa-it", bandera: "IT", nombre: "Italia", url: "../inicio-usa-italia/index.html" },
  { id: "usa-br", bandera: "BR", nombre: "Brasil", url: "../inicio-usa-brasil/index.html" },
  { id: "usa-pl", bandera: "PL", nombre: "Polska", url: "../inicio-usa-polska/index.html" }
];
(function () {
  if (/[?&]elegir\b/.test(location.search)) return;
  try {
    var u = JSON.parse(localStorage.getItem("inicio:v1:ultima") || "null");
    var ok = u && VERSIONES.some(function (v) { return v.id === u.id; });
    if (ok) location.replace(u.url);
  } catch (e) {}
})();
</script>
<style>
  :root { --paper: #f4f4f3; --surface: #ffffff; --ink: #0e0e10; --muted: #5c5c60; --line: #e0e0dd;
    box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --paper: #161618; --surface: #232325; --ink: #f2f2f2; --muted: #a3a3a8; --line: #3a3a3d; } }
  *, *::before, *::after { box-sizing: inherit; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 40px 16px; display: grid; gap: 12px; }
  a { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 14px; background: var(--surface);
      border: 1px solid var(--line); color: var(--ink); text-decoration: none; font-weight: 700; font-size: 1.1rem; }
  .f { width: 60px; height: 40px; border-radius: 4px; box-shadow: 0 0 0 1px var(--line); flex: none; }
</style>
</head>
<body>
<main id="lista"></main>
<script>
// Banderas: mismo dibujo que en las páginas de cada versión
var FLAGS = {
    ES: { color: "#aa151b", confeti: ["#aa151b", "#f1bf00"], svg: function () {
      return '<rect width="750" height="500" fill="#aa151b"/><rect y="125" width="750" height="250" fill="#f1bf00"/>'; } },
    IT: { color: "#008c45", confeti: ["#008c45", "#cd212a"], svg: function () {
      return '<rect width="250" height="500" fill="#008c45"/><rect x="250" width="250" height="500" fill="#f4f5f0"/><rect x="500" width="250" height="500" fill="#cd212a"/>'; } },
    PL: { color: "#dc143c", confeti: ["#dc143c", "#d9d9d9"], svg: function () {
      return '<rect width="750" height="250" fill="#ffffff"/><rect y="250" width="750" height="250" fill="#dc143c"/>'; } },
    BR: { color: "#009c3b", confeti: ["#009c3b", "#ffdf00", "#002776"], svg: function () {
      var stars = [[318, 292, 6], [352, 318, 5], [384, 300, 6], [410, 326, 5], [436, 296, 6], [372, 344, 5], [338, 270, 4], [456, 318, 4]]
        .map(function (s) { return '<circle cx="' + s[0] + '" cy="' + s[1] + '" r="' + s[2] + '" fill="#ffffff"/>'; }).join("");
      return '<rect width="750" height="500" fill="#009c3b"/><polygon points="64,250 375,42 686,250 375,458" fill="#ffdf00"/>' +
        '<defs><clipPath id="br-globe"><circle cx="375" cy="250" r="131"/></clipPath></defs>' +
        '<circle cx="375" cy="250" r="131" fill="#002776"/>' +
        '<path d="M232 226 Q380 176 516 290" fill="none" stroke="#ffffff" stroke-width="24" clip-path="url(#br-globe)"/>' + stars; } },
    US: { color: "#0a3161", confeti: ["#b31942", "#0a3161"], svg: function () {
      var W = 750, H = 500, stripe = H / 13, cw = W * 0.4, ch = stripe * 7, html = "", R = H * 0.0308;
      for (var i = 0; i < 13; i++) html += '<rect y="' + (i * stripe) + '" width="' + W + '" height="' + (stripe + 0.5) + '" fill="' + (i % 2 === 0 ? "#b31942" : "#ffffff") + '"/>';
      html += '<rect width="' + cw + '" height="' + ch + '" fill="#0a3161"/>';
      function star(cx, cy) {
        var pts = [];
        for (var k = 0; k < 10; k++) {
          var r = k % 2 === 0 ? R : R * 0.382, a = -Math.PI / 2 + k * Math.PI / 5;
          pts.push((cx + r * Math.cos(a)).toFixed(2) + "," + (cy + r * Math.sin(a)).toFixed(2));
        }
        return '<polygon fill="#ffffff" points="' + pts.join(" ") + '"/>';
      }
      for (var row = 0; row < 9; row++) {
        var y = (row + 1) * ch / 10, n = row % 2 === 0 ? 6 : 5;
        for (var c = 0; c < n; c++) html += star(row % 2 === 0 ? (2 * c + 1) * cw / 12 : (2 * c + 2) * cw / 12, y);
      }
      return html; } }
  };
VERSIONES.forEach(function (v) {
  var a = document.createElement("a"), F = FLAGS[v.bandera];
  a.href = v.url;
  a.innerHTML = '<svg class="f" viewBox="0 0 750 500" aria-hidden="true">' + (F ? F.svg() : "") + "</svg><span></span>";
  a.lastChild.textContent = v.nombre;
  document.getElementById("lista").appendChild(a);
});
</script>
</body>
</html>
